# Local development server with live reload: docker compose up → http://localhost:1313/
#
# Overridable through the environment or .env:
#   HUGO_VERSION    Hugo version, shared with CI (.env)
#   HUGO_PORT       host port (default 1313)
#   HUGO_BIND       host interface (default 127.0.0.1; 0.0.0.0 to test from other devices)
#   UID, GID        host user the container runs as (default 1000:1000)
services:
  hugo:
    # exts = extended edition (WebP, SCSS), same flavour as CI; pinned to HUGO_VERSION
    image: docker.io/hugomods/hugo:exts-${HUGO_VERSION}
    # Run as the host user so files written to the bind mount (resources/_gen,
    # .hugo_build.lock) aren't owned by root and git trusts the repo (enableGitInfo)
    user: "${UID:-1000}:${GID:-1000}"
    init: true # forward Ctrl+C to hugo
    tty: true
    working_dir: /src
    ports:
      - "${HUGO_BIND:-127.0.0.1}:${HUGO_PORT:-1313}:1313"
    volumes:
      - .:/src
    command:
      - hugo
      - server
      - --bind=0.0.0.0
      - --port=1313
      # browser connects to the published host port for live reload
      - --liveReloadPort=${HUGO_PORT:-1313}
      - --buildDrafts
      - --navigateToChanged
      # Fast render (incremental) is on by default; add --disableFastRender if
      # changes to layouts or data/*.json don't show up.
      # Add --poll=700ms if file changes aren't detected (e.g. repo on a
      # Windows drive under /mnt/c with WSL).
